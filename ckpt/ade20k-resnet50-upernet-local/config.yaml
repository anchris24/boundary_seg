DATASET:
  imgMaxSize: 1000
  imgSizes: (300, 375, 450, 525, 600)
  list_train: ./csail_seg/data/training.odgt
  list_val: ./csail_seg/data/validation.odgt
  num_class: 150
  padding_constant: 32
  random_flip: True
  root_dataset: ./csail_seg/data/
  segm_downsampling_rate: 4
DIR: ckpt/ade20k-resnet50-upernet-local
MODEL:
  arch_decoder: upernet
  arch_encoder: resnet50
  fc_dim: 2048
  weights_decoder: ./csail_seg/ckpt/decoder_epoch_30.pth
  weights_encoder: ./csail_seg/ckpt/encoder_epoch_30.pth
TEST:
  batch_size: 1
  checkpoint: epoch_5.pth
  result: ./
TRAIN:
  batch_size_per_gpu: 2
  beta1: 0.9
  deep_sup_scale: 0.4
  disp_iter: 5
  epoch_iters: 20
  fix_bn: False
  lr_decoder: 0.02
  lr_encoder: 0.02
  lr_pow: 0.9
  num_epoch: 5
  optim: SGD
  seed: 304
  start_epoch: 0
  weight_decay: 0.0001
  workers: 2
VAL:
  batch_size: 1
  checkpoint: epoch_5.pth
  visualize: False